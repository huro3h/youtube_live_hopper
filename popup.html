<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Live Helper</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3d;
      --accent: #ff3d6b;
      --accent2: #7c3aed;
      --text: #f0f0f8;
      --text-muted: #6b6b8a;
      --text-dim: #b8b8d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .section {
      padding: 16px 18px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-row + .toggle-row { margin-top: 14px; }
    .toggle-label { font-size: 12px; color: var(--text-dim); }
    .toggle {
      width: 36px; height: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    .toast {
      position: fixed;
      bottom: 10px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="section">
  <div class="toggle-row">
    <span class="toggle-label">常に最新位置から再生</span>
    <div class="toggle on" id="jumpToLiveToggle"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">チャットを常に全表示</span>
    <div class="toggle on" id="allChatToggle"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">固定メッセージを自動で非表示</span>
    <div class="toggle on" id="hidePinnedToggle"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
